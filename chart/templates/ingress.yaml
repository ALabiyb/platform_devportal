{{- if .Values.ingress.enabled -}}
{{- if .Values.ingress.traefik.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "devportal.fullname" . }}
  labels:
    {{- include "devportal.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ .Values.ingress.traefik.entrypoint }}
  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      services:
        - name: {{ include "devportal.fullname" . }}
          port: {{ .Values.service.port }}
  {{- if .Values.ingress.traefik.certResolver }}
  tls:
    certResolver: {{ .Values.ingress.traefik.certResolver }}
  {{- end }}
{{- else }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "devportal.fullname" . }}
  labels:
    {{- include "devportal.labels" . | nindent 4 }}
  {{- if .Values.ingress.className }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "devportal.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ include "devportal.fullname" . }}-tls
  {{- end }}
{{- end }}
{{- end }}
